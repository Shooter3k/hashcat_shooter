name: Build

##
## What is built, and what is run.
##
## The user base is Linux and Windows, so those two are built in both arrangements. Every build is
## followed by the checks in tools/test_package.sh, because a build that links is not a build that
## works: a plugin whose imports do not resolve, a package missing a directory and a core the loader
## finds somewhere else all pass a compile and fail a user.
##
## Those checks ask nothing of a backend device, because a runner has none. Anything that needs one
## says so and is left out here.
##
## macOS is built in the arrangement it ships in. FreeBSD stands in for the BSDs here, the other
## three are built weekly by .github/workflows/bsd.yml.
##
## The cross compiled binaries are the ones that ship, so they are checked too, in the job that
## builds them and before they are uploaded.
##

env:
  include_paths: |
    bridges/
    charsets/
    docs/
    extra/
    feeds/
    layouts/
    masks/
    modules/
    OpenCL/
    rules/
    tunings/
    example*
    hashcat*
    libhashcat*
    !**/*.debug

on:
  push:
    branches:
      - master
    tags:
      - v*
    paths:
      - 'OpenCL/**.h'
      - 'OpenCL/**.cl'
      - 'Rust/**'
      - 'include/**.h'
      - 'src/**.c'
      - 'src/**.h'
      - 'src/**.mk'
      - 'tools/**'
      - '**/Makefile'
      - '.github/workflows/build.yml'
      - '.github/workflows/generate_docs.sh'
      - '.github/workflows/hashcat-example-hashes_machine-readable2md.py'
  pull_request:
    branches:
      - master
    paths:
      - 'OpenCL/**.h'
      - 'OpenCL/**.cl'
      - 'Rust/**'
      - 'include/**.h'
      - 'src/**.c'
      - 'src/**.h'
      - 'src/**.mk'
      - 'tools/**'
      - '**/Makefile'
      - '.github/workflows/build.yml'
      - '.github/workflows/generate_docs.sh'
      - '.github/workflows/hashcat-example-hashes_machine-readable2md.py'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shared: [0, 1]
        include:
          - os: ubuntu-latest
            os_name: Linux
            os_name_lowercase: linux
          - os: windows-latest
            os_name: Windows
            os_name_lowercase: windows

    name: Build ${{ matrix.os_name }} (${{ matrix.shared == 0 && 'Static' || 'Shared' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install dependencies (Windows only)
        if: matrix.os_name_lowercase == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            gcc
            git
            libiconv-devel
            make
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-rustup
            mingw-w64-x86_64-toolchain
            python3

      - name: Setup Rustup (Windows only)
        if: matrix.os_name_lowercase == 'windows'
        shell: msys2 {0}
        env:
          PATH: /mingw64/bin:$PATH
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Build (Windows)
        if: matrix.os_name_lowercase == 'windows'
        shell: msys2 {0}
        env:
          SHARED: ${{ matrix.shared }}
          PATH: /mingw64/bin:$PATH
          WIN_PYTHON: ""
        run: |
          make ENABLE_LTO=0 CC=clang CXX=clang++
          bash tools/test_package.sh . --no-device

      - name: Build (Linux)
        if: matrix.os_name_lowercase == 'linux'
        env:
          SHARED: ${{ matrix.shared }}
          TERM: xterm
        run: |
          make ENABLE_LTO=0 CC=clang CXX=clang++
          bash tools/test_package.sh . --no-device

      - name: Verify automatic error reports (Windows)
        if: matrix.os_name_lowercase == 'windows' && matrix.shared == 0
        shell: msys2 {0}
        env:
          PATH: /mingw64/bin:$PATH
        run: |
          bash ./tools/test-error-report.sh ./hashcat.exe

      - name: Verify automatic error reports (Linux)
        if: matrix.os_name_lowercase == 'linux' && matrix.shared == 0
        run: |
          bash ./tools/test-error-report.sh ./hashcat

      - name: Generate documentation
        if: matrix.os_name_lowercase == 'linux' && matrix.shared == 0
        env:
          SHARED: ${{ matrix.shared }}
          TERM: xterm
        run: |
          cd .github/workflows/
          bash ./generate_docs.sh

      - name: Verify generated documentation
        if: matrix.os_name_lowercase == 'linux' && matrix.shared == 0
        run: |
          if ! git diff --quiet -- docs/hashcat-help.md docs/hashcat-example-hashes.md; then
            git diff --stat -- docs/hashcat-help.md docs/hashcat-example-hashes.md
            echo "::error::Generated help documentation is out of date. Build Hashcat, run .github/workflows/generate_docs.sh, and commit the results."
            exit 1
          fi

      - name: Generate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashcat-${{ matrix.os_name_lowercase }}-${{ matrix.shared == 0 && 'static' || 'shared' }}
          path: ${{ env.include_paths }}
