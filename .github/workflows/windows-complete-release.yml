name: Windows complete release

on:
  push:
    tags:
      - 'v*-shooter.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and package the complete Windows distribution
        shell: pwsh
        run: .\package-windows.ps1 -BuildAction Rebuild -OutputDirectory dist

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashcat-windows-x64-complete
          path: dist/*.7z
          if-no-files-found: error

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Archive = Get-ChildItem -LiteralPath dist -Filter '*.7z' -File -ErrorAction Stop

          if (@($Archive).Count -ne 1) {
            throw "Expected one release archive, found $(@($Archive).Count)."
          }

          $Hash = (Get-FileHash -LiteralPath $Archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $Tag = $env:GITHUB_REF_NAME
          $Notes = @'
          Complete Windows x64 source and prebuilt distribution.

          The single `.7z` asset contains the complete tagged source, `hashcat.exe`, every module/bridge/feed DLL, required MinGW runtime DLLs, build scripts, build metadata, and an internal `SHA256SUMS` manifest.

          Run the included binary immediately with `.\hashcat.exe`. To rebuild from the included source, run `.\build-windows.ps1 -Action Rebuild`.

          Archive SHA-256: `__ARCHIVE_SHA256__`

          See the tagged `CHANGELOG.md` for implementation and verification details.
          '@
          $Notes = $Notes.Replace('__ARCHIVE_SHA256__', $Hash)

          gh release create $Tag $Archive.FullName --verify-tag --title "hashcat_shooter $Tag" --notes $Notes
